    <radialGradient id="glow" cx="50%" cy="0%" r="90%"><stop offset="0" stop-color="#5ee0a0" stop-opacity=".16"/><stop offset="1" stop-color="#5ee0a0" stop-opacity="0"/></radialGradient>
